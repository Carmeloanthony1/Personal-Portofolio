<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Carmelo Anthony Portofolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Wajib Biar Particles Jadi Background Paling Belakang */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background-color: #01082d;
        }
    </style>
</head>
<body class="bg-[#01082d] font-sans relative">

    <div id="particles-js"></div>

    <nav class="w-full p-4 flex justify-between items-center text-[#ade1fb] font-bold text-xl relative z-10">
        <a class="cursor-pointer hover:text-blue-400">Home</a>
        <div class="flex gap-6 font-semibold">
            <a class="cursor-pointer hover:text-blue-400">Project</a>
            <a class="cursor-pointer hover:text-blue-400">Stack</a>
            <a class="cursor-pointer hover:text-blue-400">Experience</a>
            <a class="cursor-pointer hover:text-blue-400">Contact</a>
        </div>
    </nav>

    <section class="min-h-screen flex items-center justify-center -mt-16 relative z-10">
        <div class="flex flex-row items-center gap-16">
            <div class="w-60 h-72 rounded-lg shadow-xl flex items-center justify-center text-slate-700 font-semibold overflow-hidden">
                <img class="w-full h-full object-cover rounded-lg" src="asset/Photo.jpeg" alt="Carmelo Anthony">
            </div>
            <div class="flex flex-col gap-2">
                <h1 class="text-4xl font-bold text-white">Carmelo Anthony</h1>
                <h2 class="text-2xl font-bold text-gray-200">Full stack Website Developer</h2>
                <h2 class="text-xl font-bold text-gray-300">Cyber Security Enthusiast</h2>
                <div class="flex gap-6 mt-2">
                    <button class = "cursor-pointer bg-gray-300 p-3 rounded-lg hover:scale-105 transition-all">See my project</button>
                    <button class = "cursor-pointer bg-gray-300 p-3 rounded-lg hover:scale-105 transition-all">See at my Experience</button>
                </div>
            </div>
        </div>
        <a href="#profile" class="absolute bottom-6 left-1/2 -translate-x-1/2 animate-bounce cursor-pointer text-[#ade1fb] hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </a>
    </section>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
